name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build backend
      working-directory: gbs_commerce_system
      run: mvn -B clean package -DskipTests

    - name: Upload backend artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: gbs_commerce_system/target/*.jar

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install & Build
      working-directory: gbs_commerce_system_ui
      run: |
        npm install
        npm run build

    - name: Upload frontend artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: gbs_commerce_system_ui/dist
