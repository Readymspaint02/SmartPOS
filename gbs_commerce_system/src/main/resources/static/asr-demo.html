<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音识别Demo - 华为云ASR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .record-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        .record-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        .record-btn.recording {
            background: #27ae60;
            animation: pulse 1s infinite;
        }
        .record-btn .icon {
            font-size: 40px;
            margin-bottom: 5px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .status {
            text-align: center;
            color: #666;
            margin: 20px 0;
            font-size: 14px;
        }
        .result-section {
            margin-top: 30px;
        }
        .result-label {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            border: 2px solid #ddd;
        }
        .result-box.empty {
            color: #999;
            font-size: 14px;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
        }
        .info {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>语音识别 Demo</h1>
        
        <div class="record-section">
            <button class="record-btn" id="recordBtn">
                <span class="icon">🎤</span>
                <span id="btnText">点击录音</span>
            </button>
        </div>
        
        <div class="status" id="status">准备就绪，点击按钮开始录音</div>
        
        <div class="result-section">
            <div class="result-label">识别结果：</div>
            <div class="result-box empty" id="result">等待语音输入...</div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="info">
            录音格式: 16kHz 单声道 PCM<br>
            最长录音时间: 60秒
        </div>
    </div>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const btnText = document.getElementById('btnText');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        
        const API_URL = '/api/asr/recognize';
        
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });
        
        async function startRecording() {
            try {
                errorDiv.textContent = '';
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=pcm'
                });
                
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudio(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start(100);
                isRecording = true;
                
                recordBtn.classList.add('recording');
                btnText.textContent = '停止录音';
                status.textContent = '正在录音...';
                result.textContent = '录音中，请说话...';
                result.classList.add('empty');
                
            } catch (err) {
                errorDiv.textContent = '无法访问麦克风: ' + err.message;
                console.error(err);
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                recordBtn.classList.remove('recording');
                btnText.textContent = '点击录音';
                status.textContent = '正在识别...';
            }
        }
        
        async function sendAudio(audioBlob) {
            try {
                status.textContent = '正在发送音频...';
                
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                audioBase64: base64,
                                audioFormat: 'pcm16k16bit',
                                property: 'chinese_16k_common'
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (data.code === 200 && data.data) {
                            result.textContent = data.data;
                            result.classList.remove('empty');
                            status.textContent = '识别完成';
                        } else {
                            errorDiv.textContent = data.msg || '识别失败';
                            status.textContent = '识别失败';
                        }
                    } catch (err) {
                        errorDiv.textContent = '请求失败: ' + err.message;
                        status.textContent = '请求失败';
                    }
                };
                
                reader.readAsDataURL(audioBlob);
                
            } catch (err) {
                errorDiv.textContent = '发送失败: ' + err.message;
            }
        }
    </script>
</body>
</html>
