# ============================================================
# 主入口 nginx：按子域名分发多站点（示例域名，按需替换）
#   home.example.com  -> 作品集主页（静态）
#   pos.example.com   -> 收银系统（frontend 容器 + backend API 反代）
#   campus.example.com-> 校园问答（静态）
#   art.example.com   -> 艺术品平台（静态）
#   inn.example.com   -> 客栈管理（静态）
# SSL：证书就绪后取消注释 443 段并挂载证书
# ============================================================

# ---------- HTTP：全部 301 到 HTTPS（证书生效后放开） ----------
# 目前未配 SSL，直接对外服务 80；证书下来后启用 redirect
# server {
#     listen 80;
#     server_name home.example.com pos.example.com campus.example.com art.example.com inn.example.com;
#     return 301 https://$host$request_uri;
# }

# ---------- HTTP（暂无证书，直接服务） ----------

# ===== 作品集主页（home.example.com，纯静态）=====
# 视频外链 B 站 iframe，页面本身只有 HTML/CSS/JS/图片
server {
    listen 80;
    server_name home.example.com;

    root /var/www/home;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ===== 校园问答（纯静态）=====
server {
    listen 80;
    server_name campus.example.com;

    root /var/www/campus;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ===== 艺术品交易平台（纯静态）=====
server {
    listen 80;
    server_name art.example.com;

    root /var/www/art;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico|mp4|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ===== 怀旧小筑客栈（纯静态 HTML）=====
server {
    listen 80;
    server_name inn.example.com;

    root /var/www/inn;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ===== 智慧超市收银系统（核心：页面 + 后端 API + WebSocket）=====
# 全部流量交给 frontend 容器，它自己的 nginx 负责 /shop/api -> backend
# /agent -> ai-gateway:9000（AI 智能体 + 会话记忆）
# /tts   -> ai-gateway:8101（语音播报）
server {
    listen 80;
    server_name pos.example.com;

    # AI 智能体网关（DeepSeek 对话 + 会话记忆）
    location /agent/ {
        proxy_pass http://ai-gateway:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 语音播报 TTS
    location /tts/ {
        proxy_pass http://ai-gateway:8101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

